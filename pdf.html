<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Letter / Document Generator</title>
<style>
  :root { --navy: #0b1f3a; --gold: #c9a227; --border: #e2ddcb; }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f2ec; margin: 0; color: #222; }
  header { background: var(--navy); color: white; padding: 24px 32px; border-bottom: 4px solid var(--gold); }
  header h1 { margin: 0; font-size: 24px; }
  header a { color: var(--gold); font-size: 13px; text-decoration: none; }
  .wrap { max-width: 800px; margin: 24px auto; padding: 0 24px; }
  form { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
  fieldset { border: none; border-top: 1px solid var(--border); padding: 12px 0 0; margin: 0 0 16px; }
  legend { font-weight: 600; color: var(--navy); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; padding: 0 4px 0 0; }
  .row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .field { flex: 1 1 200px; display: flex; flex-direction: column; }
  label { font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
  input, textarea {
    padding: 9px 10px; border: 1px solid var(--border); border-radius: 4px;
    font-size: 14px; font-family: inherit;
  }
  textarea { min-height: 220px; resize: vertical; line-height: 1.5; }
  button {
    width: 100%; padding: 12px; background: var(--navy); color: white; border: none;
    border-radius: 4px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px;
  }
  button:hover { background: #142b4d; }
  .hint { font-size: 12px; color: #888; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Letter / Document Generator</h1>
  <a href="/index.html">&larr; Travel Bill</a>
  <a href="/watermark.html">Remove Watermark from Existing PDF &rarr;</a>
</header>

<div class="wrap">
  <form id="pdfForm">
    <fieldset>
      <legend>To</legend>
      <div class="row">
        <div class="field"><label>Recipient</label><input type="text" name="ToName" placeholder="The Immigration Officer / FRRO" /></div>
        <div class="field"><label>Recipient line 2</label><input type="text" name="ToLine2" placeholder="India" /></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>From</legend>
      <div class="row">
        <div class="field"><label>Your Name</label><input type="text" name="FromName" placeholder="Tenes Paramesvaran" /></div>
        <div class="field"><label>Your line 2</label><input type="text" name="FromLine2" placeholder="Passport No: A59584991" /></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Subject &amp; Greeting</legend>
      <div class="field" style="margin-bottom:12px">
        <label>Subject</label>
        <input type="text" name="Subject" placeholder="Request for Exit Permission Due to Overstay" />
      </div>
      <div class="field">
        <label>Salutation</label>
        <input type="text" name="Salutation" value="Respected Sir/Madam," />
      </div>
    </fieldset>

    <fieldset>
      <legend>Body</legend>
      <div class="field">
        <label>Main content (blank line = new paragraph)</label>
        <textarea name="Body" placeholder="My visa expired on... "></textarea>
      </div>
    </fieldset>

    <fieldset>
      <legend>Closing &amp; Signature</legend>
      <div class="row">
        <div class="field"><label>Closing line</label><input type="text" name="Closing" value="Thank you." /></div>
        <div class="field"><label>Sign-off</label><input type="text" name="SignOff" value="Yours faithfully," /></div>
      </div>
      <div class="row">
        <div class="field"><label>Signature Name</label><input type="text" name="SignatureName" placeholder="Tenes Paramesvaran" /></div>
        <div class="field"><label>Signature line 2</label><input type="text" name="SignatureLine2" placeholder="Passport No: A59584991" /></div>
      </div>
    </fieldset>

    <div class="field" style="margin-bottom:16px">
      <label>File Name (no extension)</label>
      <input type="text" name="FileName" value="letter" />
    </div>

    <button type="submit">Generate Clean PDF</button>
    <div class="hint">Renders with PdfSharpCore &mdash; free, open-source, no watermark or branding.</div>
  </form>
</div>

<script>
document.getElementById('pdfForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const payload = Object.fromEntries(new FormData(form).entries());
  const btn = form.querySelector('button');
  const originalText = btn.textContent;
  btn.textContent = 'Generating...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/generate-pdf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('Failed: ' + res.status);

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${payload.FileName || 'letter'}.pdf`;
    a.click();
  } catch (err) {
    alert('Error generating PDF: ' + err.message);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
